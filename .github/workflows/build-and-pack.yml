name: "build-and-pack"
on:
  push:
    branches:
      - main
      - "v*"

permissions:
  contents: write

jobs:
  build:
    env:
      PACKED_JS_PATH: "dist/index.js"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push packed js
        env:
          PACKED_JS_PATH: ${{ env.PACKED_JS_PATH }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status "$PACKED_JS_PATH" --porcelain)" ]; then
            echo "$PACKED_JS_PATH is up to date"
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$PACKED_JS_PATH"
          git commit -m "Pack with dependencies to $PACKED_JS_PATH"
          git push origin "HEAD:$REF_NAME"
