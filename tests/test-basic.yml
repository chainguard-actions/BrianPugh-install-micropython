name: Test basic usage - install MicroPython with pinned tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          reference: v1.24.1

      - name: Assert sha output is a valid git SHA
        env:
          SHA: ${{ steps.action.outputs.sha }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "sha: $SHA"
          echo "cache-hit: $CACHE_HIT"

          # Validate sha is a 40-character hex string
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: sha output '$SHA' is not a valid 40-character git SHA"
            exit 1
          fi
          echo "PASS: sha is a valid git SHA"

          # Validate cache-hit is either 'true' or 'false'
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: cache-hit output '$CACHE_HIT' is not 'true' or 'false'"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT'"

      - name: Assert micropython binary is available
        run: |
          if ! command -v micropython >/dev/null 2>&1; then
            echo "FAIL: micropython binary not found in PATH"
            exit 1
          fi
          echo "PASS: micropython is available at $(which micropython)"
          micropython --version

      - name: Assert mpy-cross binary is available
        run: |
          if ! command -v mpy-cross >/dev/null 2>&1; then
            echo "FAIL: mpy-cross binary not found in PATH"
            exit 1
          fi
          echo "PASS: mpy-cross is available at $(which mpy-cross)"

      - name: Assert MPY_DIR environment variable is set
        env:
          MPY_DIR: ${{ env.MPY_DIR }}
        run: |
          echo "MPY_DIR: $MPY_DIR"
          if [ -z "$MPY_DIR" ]; then
            echo "FAIL: MPY_DIR environment variable is not set"
            exit 1
          fi
          if [ ! -d "$MPY_DIR" ]; then
            echo "FAIL: MPY_DIR '$MPY_DIR' does not exist"
            exit 1
          fi
          echo "PASS: MPY_DIR is set to '$MPY_DIR'"
