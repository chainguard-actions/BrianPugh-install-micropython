name: Test MicroPython installation with cflags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install MicroPython with cflags
        uses: .
        with:
          reference: v1.22.0
          cflags: '-DMICROPY_PY_RE_MATCH_GROUPS=1'

      - name: Assert CFLAGS_EXTRA environment variable is set
        run: |
          echo "CFLAGS_EXTRA=$CFLAGS_EXTRA"
          if [ "$CFLAGS_EXTRA" != "-DMICROPY_PY_RE_MATCH_GROUPS=1" ]; then
            echo "FAIL: expected CFLAGS_EXTRA='-DMICROPY_PY_RE_MATCH_GROUPS=1', got '$CFLAGS_EXTRA'"
            exit 1
          fi
          echo "PASS: CFLAGS_EXTRA is set correctly"

      - name: Assert micropython binary is installed
        run: |
          if ! command -v micropython &>/dev/null; then
            echo "FAIL: micropython binary not found in PATH"
            exit 1
          fi
          echo "PASS: micropython found at $(which micropython)"

      - name: Assert mpy-cross binary is installed
        run: |
          if ! command -v mpy-cross &>/dev/null; then
            echo "FAIL: mpy-cross binary not found in PATH"
            exit 1
          fi
          echo "PASS: mpy-cross found at $(which mpy-cross)"

      - name: Assert MPY_DIR environment variable is set
        run: |
          echo "MPY_DIR=$MPY_DIR"
          if [ -z "$MPY_DIR" ]; then
            echo "FAIL: MPY_DIR environment variable is not set"
            exit 1
          fi
          echo "PASS: MPY_DIR=$MPY_DIR"
