name: Test reference input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          reference: v1.22.0
      - name: Assert micropython is installed
        run: |
          echo "Checking micropython installation..."
          if ! command -v micropython &>/dev/null; then
            echo "FAIL: micropython not found in PATH"
            exit 1
          fi
          echo "PASS: micropython is installed"
          micropython --version
