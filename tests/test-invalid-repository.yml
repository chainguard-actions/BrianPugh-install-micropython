name: Test invalid repository fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        with:
          repository: https://github.com/BrianPugh/this-repo-does-not-exist-act-test
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent repository"
            exit 1
          fi
          if [ -n "$SHA" ]; then
            echo "FAIL: sha should not be set"
            exit 1
          fi
          echo "PASS"
