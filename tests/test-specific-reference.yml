name: Test install MicroPython with specific reference
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          reference: "v1.23.0"
      - name: Assert micropython is installed and executable
        run: |
          echo "Checking micropython is in PATH..."
          if ! command -v micropython &>/dev/null; then
            echo "FAIL: micropython not found in PATH"
            exit 1
          fi
          echo "micropython found at: $(command -v micropython)"
          echo "PASS"
      - name: Assert micropython version output
        run: |
          echo "Checking micropython version..."
          VERSION_OUTPUT=$(micropython --version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: micropython --version produced no output"
            exit 1
          fi
          echo "PASS"
